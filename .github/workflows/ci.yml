name: CI

on:
  push:
    branches: [develop, master, v6]
  pull_request:

jobs:
  tools:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:tools
      - run: npm run build
      # Everything under docs/ is generated and committed: the component pages,
      # the tokens page, the ten guides rendered from src/guides/, and
      # docs/llms.txt and docs/llms-full.txt, which only npm run build writes
      # (it calls gen-llms itself). Regenerating the pages after the build, so
      # both kinds of generated file are on disk together, is how a pull request
      # that edited a manifest or a guide source without running npm run docs is
      # caught, and the diff names the file that is stale.
      - run: npm run docs
      - name: The generated docs are committed
        run: git diff --exit-code docs

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      # Screenshot baselines are captured on a Mac and depend on its fonts; on
      # Ubuntu every one differs by a few pixels of text metrics, so CI runs the
      # suite with the snapshot comparisons ignored and the baselines stay a
      # local regression tool. See CONTRIBUTING.md, Screenshots.
      - run: npx playwright test --ignore-snapshots
