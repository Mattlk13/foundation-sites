<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lift fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Lift utility</h1>
		<div id="stage">
			<div class="cluster" data-gap="md">
				<article class="card lift" id="card" data-raised>
					<h2><a href="#one" id="link" data-stretch>Hover or focus me</a></h2>
					<p>The card rises and its shadow deepens.</p>
				</article>
				<article class="card" id="still" data-raised>
					<h2><a href="#two" data-stretch>No lift here</a></h2>
					<p>For comparing against the card that lifts.</p>
				</article>
			</div>
		</div>
	</main>
</body>
</html>
