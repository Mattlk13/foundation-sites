<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Print fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Print</h1>
		<div id="stage">
			<p class="print" data-print="only" id="url">https://foundationcss.com/guides/visibility</p>
			<p class="print" id="bare">Printed 22 September 2026.</p>
			<p><button class="button print" data-print="none" type="button" id="share">Share this page</button></p>
			<p id="plain">On the screen and on the paper alike.</p>
		</div>
	</main>
</body>
</html>
