<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fit fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>
		#stage { inline-size: 100%; }
		#tiny { inline-size: 120px; }
		#narrow { inline-size: 200px; }
		#wide, #paired { inline-size: 400px; }
		#huge { inline-size: 900px; }
	</style>
</head>
<body>
	<main>
		<h1>Fit</h1>
		<div id="stage">
			<div class="container" id="tiny"><h2 class="fit" id="tiny-title">Fit</h2></div>
			<div class="container" id="narrow"><h2 class="fit" id="narrow-title">Fit</h2></div>
			<div class="container" id="wide"><h2 class="fit" id="wide-title">Fit</h2></div>
			<div class="container" id="huge"><h2 class="fit" id="huge-title">Fit</h2></div>
			<div class="container" id="paired"><h2 class="fit" data-fit="sm-xl" id="pair-title">Fit</h2></div>
			<h2 class="fit" id="bare-title">Fit</h2>
		</div>
	</main>
</body>
</html>
