<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Billboard fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>
		#stage { inline-size: 100%; }
		#tiny { inline-size: 120px; }
		#narrow { inline-size: 200px; }
		#wide, #paired { inline-size: 400px; }
		#huge { inline-size: 900px; }
	</style>
</head>
<body>
	<main>
		<h1>Billboard</h1>
		<div id="stage">
			<div class="container" id="tiny"><h2 class="billboard" id="tiny-title">Billboard</h2></div>
			<div class="container" id="narrow"><h2 class="billboard" id="narrow-title">Billboard</h2></div>
			<div class="container" id="wide"><h2 class="billboard" id="wide-title">Billboard</h2><p class="billboard" id="prose-board">Board</p></div>
			<div class="container" id="huge"><h2 class="billboard" id="huge-title">Billboard</h2></div>
			<div class="container" id="paired"><h2 class="billboard" data-fit="sm-xl" id="pair-title">Billboard</h2></div>
			<h2 class="billboard" id="bare-title">Billboard</h2>
		</div>
	</main>
</body>
</html>
