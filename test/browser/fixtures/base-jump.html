<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Scroll padding fixture</title>
	<link rel="stylesheet" href="../../../src/yeti.css">
</head>
<body>
	<div class="stack" data-gap="none" id="page">
		<nav class="item" id="bar" data-sticky aria-label="Pinned" style="block-size: 48px; background: var(--yeti-color-primary-subtle); --yeti-sticky-offset: 0">A pinned bar</nav>
		<main>
			<h1>A page that jumps</h1>
			<p style="block-size: 150vh">Filler so the headings are below the fold.</p>
			<h2 id="two">The second heading</h2>
			<p style="block-size: 150vh">More filler.</p>
			<h2 id="three">The third heading</h2>
			<p style="block-size: 150vh">More filler.</p>
		</main>
	</div>
</body>
</html>
