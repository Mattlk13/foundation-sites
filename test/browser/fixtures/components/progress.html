<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Progress fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Progress component</h1>
		<div id="stage">
			<progress class="progress" id="bar" value="40" max="100" aria-label="Upload">40%</progress>
			<progress class="progress" id="busy" aria-label="Loading">Loading</progress>
			<progress class="progress" id="lg" data-size="lg" value="3" max="5" aria-label="Steps">3 of 5</progress>
			<div class="stack" data-gap="sm" id="reading">
				<div class="progress" id="scroll" data-scroll aria-hidden="true" data-sticky></div>
				<div id="spacer" style="block-size: 300vh"></div>
			</div>
		</div>
	</main>
</body>
</html>
