<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tabs fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<script type="module" src="../../../../src/components/tabs/tabs.js"></script>
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Tabs component</h1>
		<div id="stage">
			<div class="tabs" id="tabs">
				<div role="tablist" aria-label="Account">
					<button type="button" role="tab" id="t1" aria-controls="p1" data-contrast>Profile</button>
					<button type="button" role="tab" id="t2" aria-controls="p2" data-contrast>Billing</button>
					<button type="button" role="tab" id="t3" aria-controls="p3">Alerts</button>
				</div>
				<section role="tabpanel" id="p1" aria-labelledby="t1"><p>Profile panel.</p></section>
				<section role="tabpanel" id="p2" aria-labelledby="t2"><p id="deep">Billing panel.</p></section>
				<section role="tabpanel" id="p3" aria-labelledby="t3"><p id="deep3">Alerts panel.</p></section>
			</div>
			<div class="tabs" id="vertical" data-orientation="vertical">
				<div role="tablist" aria-label="Settings">
					<button type="button" role="tab" id="v1" aria-controls="vp1">General</button>
					<button type="button" role="tab" id="v2" aria-controls="vp2">Keys</button>
				</div>
				<section role="tabpanel" id="vp1" aria-labelledby="v1"><p>General.</p></section>
				<section role="tabpanel" id="vp2" aria-labelledby="v2"><p>Keys.</p></section>
			</div>
			<div class="tabs" id="filled" data-emphasis="high">
				<div role="tablist" aria-label="Filled">
					<button type="button" role="tab" id="f1" aria-controls="fp1" data-contrast>Overview</button>
					<button type="button" role="tab" id="f2" aria-controls="fp2" data-contrast>Details</button>
				</div>
				<section role="tabpanel" id="fp1" aria-labelledby="f1"><p>Overview panel.</p></section>
				<section role="tabpanel" id="fp2" aria-labelledby="f2"><p>Details panel.</p></section>
			</div>
			<div class="tabs" id="filled-vertical" data-orientation="vertical" data-emphasis="high">
				<div role="tablist" aria-label="Filled settings">
					<button type="button" role="tab" id="vf1" aria-controls="vfp1">General</button>
					<button type="button" role="tab" id="vf2" aria-controls="vfp2">Keys</button>
				</div>
				<section role="tabpanel" id="vfp1" aria-labelledby="vf1"><p>General.</p></section>
				<section role="tabpanel" id="vfp2" aria-labelledby="vf2"><p>Keys.</p></section>
			</div>
			<div class="tabs" id="outer">
				<div role="tablist" aria-label="Outer">
					<button type="button" role="tab" id="o1" aria-controls="op1">Summary</button>
					<button type="button" role="tab" id="o2" aria-controls="op2">Sections</button>
				</div>
				<section role="tabpanel" id="op1" aria-labelledby="o1"><p>Summary panel.</p></section>
				<section role="tabpanel" id="op2" aria-labelledby="o2">
					<div class="tabs" id="inner">
						<div role="tablist" aria-label="Inner">
							<button type="button" role="tab" id="i1" aria-controls="ip1">First</button>
							<button type="button" role="tab" id="i2" aria-controls="ip2">Second</button>
						</div>
						<section role="tabpanel" id="ip1" aria-labelledby="i1"><p>First inner panel.</p></section>
						<section role="tabpanel" id="ip2" aria-labelledby="i2"><p id="deep2">Second inner panel.</p></section>
					</div>
				</section>
			</div>
			<div class="tabs" id="look-outer" data-orientation="vertical" data-emphasis="high">
				<div role="tablist" aria-label="Outer look">
					<button type="button" role="tab" id="lo1" aria-controls="lop1">Outer</button>
					<button type="button" role="tab" id="lo2" aria-controls="lop2">Other</button>
				</div>
				<section role="tabpanel" id="lop1" aria-labelledby="lo1">
					<div class="tabs" id="look-inner">
						<div role="tablist" aria-label="Inner look">
							<button type="button" role="tab" id="li1" aria-controls="lip1">Plain</button>
							<button type="button" role="tab" id="li2" aria-controls="lip2">Tab</button>
						</div>
						<section role="tabpanel" id="lip1" aria-labelledby="li1"><p>Plain inner panel.</p></section>
						<section role="tabpanel" id="lip2" aria-labelledby="li2"><p>Second plain inner panel.</p></section>
					</div>
				</section>
				<section role="tabpanel" id="lop2" aria-labelledby="lo2"><p>Other panel.</p></section>
			</div>
			<a href="#deep" id="to-deep">To the second panel</a>
			<a href="#deep2" id="to-deep2">To the second inner panel</a>
		</div>
	</main>
</body>
</html>
