<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Scroller fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Scroller</h1>
		<div id="stage">
			<div class="scroller" id="scroller" role="region" aria-label="Plain track" tabindex="0">
				<div class="item" id="s1" style="inline-size: 200px">s1</div>
				<div class="item" id="s2" style="inline-size: 200px">s2</div>
				<div class="item" id="s3" style="inline-size: 200px">s3</div>
				<div class="item" id="s4" style="inline-size: 200px">s4</div>
				<div class="item" id="s5" style="inline-size: 200px">s5</div>
				<div class="item" id="s6" style="inline-size: 200px">s6</div>
			</div>
			<div class="scroller" id="snapped" data-snap data-width="xs" role="region" aria-label="Snapping track" tabindex="0">
				<div class="item" id="n1">n1</div>
				<div class="item" id="n2">n2</div>
				<div class="item" id="n3">n3</div>
				<div class="item" id="n4">n4</div>
				<div class="item" id="n5">n5</div>
				<div class="item" id="n6">n6</div>
			</div>
			<div class="scroller" id="centered" data-snap data-justify="center" data-width="xs" role="region" aria-label="Centering track" tabindex="0">
				<div class="item" id="c1">c1</div>
				<div class="item" id="c2">c2</div>
				<div class="item" id="c3">c3</div>
				<div class="item" id="c4">c4</div>
				<div class="item" id="c5">c5</div>
				<div class="item" id="c6">c6</div>
			</div>
			<div class="scroller" id="ended" data-snap data-justify="end" data-width="xs" role="region" aria-label="Ending track" tabindex="0">
				<div class="item" id="e1">e1</div>
				<div class="item" id="e2">e2</div>
				<div class="item" id="e3">e3</div>
				<div class="item" id="e4">e4</div>
				<div class="item" id="e5">e5</div>
				<div class="item" id="e6">e6</div>
			</div>
			<div class="scroller" id="wide" role="region" aria-label="A wide drawing" tabindex="0">
				<svg id="wide-svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Wide drawing"><rect width="900" height="120" fill="currentColor"/></svg>
			</div>
			<div class="scroller" id="hidden-head" role="region" aria-label="Feed actions" tabindex="0">
				<table class="table" id="hidden-head-table" style="min-inline-size: 700px">
					<thead>
						<tr>
							<th scope="col">Service</th>
							<th scope="col">Time</th>
							<th scope="col">Status</th>
							<th scope="col"><span class="visually-hidden">Actions</span></th>
						</tr>
					</thead>
					<tbody>
						<tr><td>12</td><td>08:14</td><td>On time</td><td>Edit</td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</body>
</html>
