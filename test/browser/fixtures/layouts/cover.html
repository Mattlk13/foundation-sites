<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cover fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Cover</h1>
		<div id="stage">
			<div class="cover" id="cover">
				<p class="item" id="header">Header</p>
				<h2 class="item" id="center" data-center>Centered</h2>
				<p class="item" id="footer">Footer</p>
			</div>
			<div class="cover" id="short" style="--yeti-cover-height: 400px">
				<p class="item" data-center>Only child</p>
			</div>
			<div class="cover" id="md-band" data-height="md">
				<p class="item" data-center>A band of the md height</p>
			</div>
			<div class="cover" id="half-band" data-height="half">
				<p class="item" data-center>Half the viewport</p>
			</div>
			<div class="cover" id="overflow" data-height="sm">
				<div class="item" id="tall" data-center style="block-size: 400px">Taller than the sm band it is in</div>
			</div>
		</div>
	</main>
</body>
</html>
