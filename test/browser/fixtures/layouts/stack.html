<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Stack fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Stack</h1>
		<div id="stage">
			<div class="stack" id="stack" style="block-size: 600px">
				<div class="item" id="a">One</div>
				<div class="item" id="b">Two</div>
				<div class="item" id="c">Three</div>
				<div class="item" id="d" data-split>Split</div>
			</div>
			<div class="stack" id="stack-sm" data-gap="sm" data-align="start">
				<div class="item" id="sa">One</div>
				<div class="item" id="sb">Two</div>
			</div>
			<div class="stack" id="spaced">
				<div class="item" id="e1" data-space="xl">First, where the marker does nothing</div>
				<div class="item" id="e2" data-space="xl">More room above this one</div>
				<div class="item" id="e3" data-space="xs">Less room above this one</div>
				<div class="item" id="e4">Back at the stack's gap</div>
			</div>
			<div class="stack" id="fill" data-fill>
				<div class="item" id="f-top">Top</div>
				<div class="item" id="f-bottom" data-split>Bottom</div>
			</div>
		</div>
	</main>
</body>
</html>
