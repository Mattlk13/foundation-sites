<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Show and hide fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Show and hide</h1>
		<div id="stage">
			<div class="container" id="box">
				<div class="stack" data-gap="sm">
					<p class="box" data-surface="raised" data-show="md" id="wide">Shown from md up</p>
					<p class="box" data-surface="raised" data-hide="md" id="narrow">Hidden from md up</p>
					<p class="box" data-surface="raised" id="always">Always here</p>
				</div>
			</div>
			<div class="stack" data-gap="sm" id="loose">
				<p class="box" data-surface="raised" data-show="md" id="loose-show">No size container above this one, so it stays</p>
				<p class="box" data-surface="raised" data-hide="md" id="loose-hide">No size container above this one either, so it stays too</p>
			</div>
		</div>
	</main>
</body>
</html>
