<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Skip link fixture</title>
	<link rel="stylesheet" href="../../../src/yeti.css">
</head>
<body>
	<a href="#content" id="skip">Skip to content</a>
	<header>
		<p><a href="#content" id="second">A link that is not the first child of the body.</a></p>
	</header>
	<main id="content">
		<h1>A page with a skip link</h1>
		<p>The link above is out of sight until a keyboard reaches it.</p>
	</main>
</body>
</html>
